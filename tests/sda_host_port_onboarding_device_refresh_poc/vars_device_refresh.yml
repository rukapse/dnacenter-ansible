---
# ==============================================================================
# SDA Host Port Onboarding — Device Refresh / Migration Variables
# ==============================================================================
# PURPOSE:
#   Migrate SDA host port onboarding configurations from a source device
#   (e.g., Cat9k being decommissioned) to a destination device (e.g., Cat9350
#   replacement) within the same fabric site on Cisco Catalyst Center.
#
# INSTRUCTIONS:
#   1. Update the catalyst_center section with your Catalyst Center credentials
#   2. Update fabric_site_hierarchy with your exact fabric site path
#   3. Update source_device_ip with the device being replaced
#   4. Update destination_device_ip with the new replacement device
#   5. Run: ansible-playbook -i inventory.yml playbook_device_refresh.yml
# ==============================================================================

# --- Catalyst Center Connection ---
catalyst_center_host: "10.195.120.197"
catalyst_center_username: "admin"
catalyst_center_password: "C1sc0dna"
catalyst_center_verify: false
catalyst_center_port: 443
catalyst_center_version: "2.3.7.9"
catalyst_center_debug: false
catalyst_center_api_task_timeout: 1200

# --- Fabric Site (must match EXACT hierarchy in Catalyst Center, case-sensitive) ---
fabric_site_hierarchy: "Global/California/23"

# --- Source Device (the device being replaced/decommissioned) ---
source_device_ip: "10.195.120.219"

# --- Destination Device (the new replacement device, must already be provisioned in the fabric site) ---
destination_device_ip: "10.195.120.173"

# --- Components to Extract (which host port onboarding components to migrate) ---
# Options: "port_assignments", "port_channels", "wireless_ssids"
components_to_migrate:
  - "port_assignments"
  - "port_channels"
  - "wireless_ssids"

# --- Config Extraction File Path ---
# Where to save the extracted config from the source device (intermediate file)
extracted_config_file: "{{ playbook_dir }}/extracted_source_config.yml"
